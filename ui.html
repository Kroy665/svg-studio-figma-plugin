<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>SVG Studio v0.0.2</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%;
      overflow: hidden
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif;
      background: #1e1e1e;
      color: #e5e5e5;
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-size: 12px
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid #333;
      background: #242424;
      flex-shrink: 0
    }

    .logo {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 7px
    }

    .logo-dot {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      background: linear-gradient(135deg, #4f46e5, #ec4899);
      flex-shrink: 0
    }

    .logo-dot.loading {
      animation: pulse 1.5s ease-in-out infinite
    }

    @keyframes pulse {
      0%, 100% { opacity: 1 }
      50% { opacity: 0.5 }
    }

    .search-wrap {
      flex: 1;
      position: relative
    }

    .search-input {
      width: 100%;
      background: #2d2d2d;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 7px 12px 7px 32px;
      color: #e5e5e5;
      font-size: 12px;
      outline: none;
      transition: border-color .15s
    }

    .search-input:focus {
      border-color: #18a0fb
    }

    .search-input::placeholder {
      color: #666
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #777;
      pointer-events: none
    }

    .upload-btn {
      background: #18a0fb;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background .15s
    }

    .upload-btn:hover {
      background: #0d8de0
    }

    .main {
      display: flex;
      flex: 1;
      overflow: hidden
    }

    .sidebar {
      width: 128px;
      min-width: 128px;
      border-right: 1px solid #333;
      overflow-y: auto;
      padding: 6px 0;
      background: #1e1e1e;
      flex-shrink: 0
    }

    .cat-item {
      padding: 7px 10px;
      font-size: 11.5px;
      cursor: pointer;
      color: #aaa;
      border-radius: 5px;
      margin: 1px 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
      transition: all .1s;
      user-select: none
    }

    .cat-item:hover {
      background: #2a2a2a;
      color: #e5e5e5
    }

    .cat-item.active {
      background: #18a0fb18;
      color: #18a0fb;
      font-weight: 600
    }

    .cat-label {
      flex: 1
    }

    .cat-count {
      font-size: 9.5px;
      color: #555;
      background: #2a2a2a;
      border-radius: 8px;
      padding: 1px 5px;
      min-width: 18px;
      text-align: center
    }

    .cat-item.active .cat-count {
      background: #18a0fb22;
      color: #18a0fb99
    }

    .grid-area {
      flex: 1;
      overflow-y: auto;
      padding: 10px
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(86px, 1fr));
      gap: 8px
    }

    .card {
      background: #252525;
      border-radius: 8px;
      padding: 8px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color .12s, background .12s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px
    }

    .card:hover {
      border-color: #18a0fb55;
      background: #2c2c2c
    }

    .card-preview {
      width: 70px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      background: #1a1a1a;
      overflow: hidden;
      flex-shrink: 0
    }

    .card-preview svg {
      width: 100%;
      height: 100%;
      display: block
    }

    .card-name {
      font-size: 9.5px;
      color: #aaa;
      text-align: center;
      line-height: 1.3;
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .card-insert {
      width: 100%;
      padding: 4px 0;
      background: #18a0fb;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: background .1s
    }

    .card-insert:hover {
      background: #0d8de0
    }

    .card-insert:active {
      background: #0a7ac8
    }

    .card-actions {
      display: flex;
      gap: 4px;
      width: 100%;
    }

    .card-delete {
      flex: 1;
      padding: 3px 0;
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 9px;
      cursor: pointer;
      font-weight: 600;
      transition: background .1s
    }

    .card-delete:hover {
      background: #dc2626
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #555;
      font-size: 12px;
      padding: 60px 20px
    }

    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      color: #888;
      font-size: 12px;
      padding: 60px 20px
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #333;
      border-top-color: #18a0fb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite
    }

    @keyframes spin {
      to { transform: rotate(360deg) }
    }

    .error-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      color: #ef4444;
      font-size: 12px;
      padding: 60px 20px;
      text-align: center
    }

    .error-state button {
      background: #18a0fb;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .footer {
      padding: 6px 14px;
      border-top: 1px solid #2a2a2a;
      font-size: 10.5px;
      color: #555;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e1e1e;
      flex-shrink: 0
    }

    .backend-status {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ef4444
    }

    .status-dot.online {
      background: #10b981
    }

    .toast {
      position: fixed;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: #2d2d2d;
      border: 1px solid #444;
      color: #e5e5e5;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 11px;
      opacity: 0;
      transition: all .2s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 999
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0)
    }

    .toast.error {
      border-color: #ef4444;
      color: #fca5a5
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px
    }

    .modal-content {
      background: #242424;
      border-radius: 8px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      border: 1px solid #333
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: space-between
    }

    .modal-header h3 {
      font-size: 14px;
      font-weight: 600;
      margin: 0
    }

    .modal-close {
      background: none;
      border: none;
      color: #888;
      font-size: 24px;
      cursor: pointer;
      padding: 0;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      transition: all .2s
    }

    .modal-close:hover {
      background: #333;
      color: #fff
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1
    }

    .modal-footer {
      padding: 16px 20px;
      border-top: 1px solid #333;
      display: flex;
      gap: 10px;
      justify-content: flex-end
    }

    .upload-area {
      border: 2px dashed #444;
      border-radius: 8px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all .2s;
      background: #1a1a1a
    }

    .upload-area:hover {
      border-color: #666;
      background: #222
    }

    .upload-area.dragover {
      border-color: #3b82f6;
      background: #1e3a5f
    }

    .upload-preview {
      display: flex;
      gap: 20px;
      flex-direction: column
    }

    .preview-svg {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 150px
    }

    .preview-svg svg {
      max-width: 200px;
      max-height: 150px
    }

    .upload-form {
      display: flex;
      flex-direction: column;
      gap: 16px
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .form-group label {
      font-size: 11px;
      font-weight: 500;
      color: #aaa
    }

    .form-group input,
    .form-group select {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 8px 12px;
      color: #e5e5e5;
      font-size: 12px;
      font-family: inherit
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #3b82f6
    }

    .btn-primary,
    .btn-secondary {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all .2s;
      border: none
    }

    .btn-primary {
      background: #3b82f6;
      color: white
    }

    .btn-primary:hover:not(:disabled) {
      background: #2563eb
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed
    }

    .btn-secondary {
      background: #333;
      color: #e5e5e5
    }

    .btn-secondary:hover {
      background: #444
    }

    ::-webkit-scrollbar {
      width: 4px
    }

    ::-webkit-scrollbar-track {
      background: transparent
    }

    ::-webkit-scrollbar-thumb {
      background: #3a3a3a;
      border-radius: 2px
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="logo">
      <div class="logo-dot" id="logo-dot"></div>
      SVG Studio (v0.0.2)
    </div>
    <div class="search-wrap">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2.5">
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input class="search-input" id="search" type="text" placeholder="Search shapes...">
    </div>
    <button class="upload-btn" id="upload-btn" title="Upload custom SVG" onclick="openUploadModal()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="17 8 12 3 7 8"></polyline>
        <line x1="12" y1="3" x2="12" y2="15"></line>
      </svg>
      Upload
    </button>
  </div>

  <div class="main">
    <nav class="sidebar" id="sidebar">
      <!-- Categories loaded from API -->
    </nav>

    <div class="grid-area">
      <div class="loading-state" id="loading">
        <div class="spinner"></div>
        <span>Loading shapes...</span>
      </div>

      <div class="grid" id="grid" style="display:none"></div>

      <div class="empty-state" id="empty" style="display:none">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
          style="opacity:.3">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <span>No shapes found</span>
      </div>

      <div class="error-state" id="error" style="display:none">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <div>
          <div style="font-weight:600;margin-bottom:5px">Backend Not Running</div>
          <div style="font-size:11px;color:#888">Start the backend server:</div>
          <div style="font-size:10px;color:#666;margin-top:5px">npm run dev</div>
        </div>
        <button onclick="window.location.reload()">Retry Connection</button>
      </div>
    </div>
  </div>

  <div class="footer">
    <span id="count-label">Loading...</span>
    <div class="backend-status">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">Connecting...</span>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Upload Modal -->
  <div class="modal-overlay" id="upload-modal" style="display:none" onclick="closeModalOnOverlay(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3>Upload Custom SVG</h3>
        <button class="modal-close" onclick="closeUploadModal()">×</button>
      </div>
      <div class="modal-body">
        <div class="upload-area" id="upload-area">
          <input type="file" id="file-input" accept=".svg" style="display:none" onchange="handleFileSelect(event)">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity:0.3">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <div style="margin-top:10px;font-weight:500">Drag & drop SVG file here</div>
          <div style="margin-top:5px;font-size:11px;color:#888">or click to browse</div>
          <div style="margin-top:8px;font-size:10px;color:#666">Max size: 512KB</div>
        </div>

        <div class="upload-preview" id="upload-preview" style="display:none">
          <div class="preview-svg" id="preview-svg"></div>
          <div class="upload-form">
            <div class="form-group">
              <label>Shape Name</label>
              <input type="text" id="shape-name" placeholder="My Custom Shape" required>
            </div>
            <div class="form-group">
              <label>Category</label>
              <select id="shape-category">
                <option value="custom">Custom</option>
                <option value="shapes">Shapes</option>
                <option value="blobs">Blobs</option>
                <option value="waves">Waves</option>
                <option value="dividers">Dividers</option>
                <option value="frames">Frames</option>
                <option value="borders">Borders</option>
              </select>
            </div>
            <div class="form-group">
              <label>Tags (optional)</label>
              <input type="text" id="shape-tags" placeholder="custom, icon, ui">
              <div style="font-size:10px;color:#666;margin-top:3px">Comma-separated</div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeUploadModal()">Cancel</button>
        <button class="btn-primary" id="upload-submit" onclick="submitUpload()" disabled>Upload & Save</button>
      </div>
    </div>
  </div>

  <script>
    // Configuration
    const API_BASE_URL = 'http://localhost:3456';

    // State
    let allShapes = [];
    let allCategories = [];
    let currentCat = 'all';
    let currentSearch = '';
    let backendOnline = false;

    // API Functions
    async function checkBackend() {
      try {
        const response = await fetch(`${API_BASE_URL}/health`);
        return response.ok;
      } catch (error) {
        return false;
      }
    }

    async function fetchCategories() {
      const response = await fetch(`${API_BASE_URL}/api/categories`);
      if (!response.ok) throw new Error('Failed to fetch categories');
      const data = await response.json();
      return data.data;
    }

    async function fetchShapes(category = null, search = null) {
      let url = `${API_BASE_URL}/api/shapes`;
      const params = new URLSearchParams();

      if (category && category !== 'all') params.append('category', category);
      if (search) params.append('search', search);

      if (params.toString()) url += '?' + params.toString();

      const response = await fetch(url);
      if (!response.ok) throw new Error('Failed to fetch shapes');
      const data = await response.json();
      return data.data;
    }

    async function deleteShape(id) {
      const response = await fetch(`${API_BASE_URL}/api/shapes/${id}`, {
        method: 'DELETE'
      });
      if (!response.ok) throw new Error('Failed to delete shape');
      return response.json();
    }

    // UI Functions
    function showLoading() {
      document.getElementById('loading').style.display = 'flex';
      document.getElementById('grid').style.display = 'none';
      document.getElementById('empty').style.display = 'none';
      document.getElementById('error').style.display = 'none';
      document.getElementById('logo-dot').classList.add('loading');
    }

    function hideLoading() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('logo-dot').classList.remove('loading');
    }

    function showError() {
      document.getElementById('error').style.display = 'flex';
      document.getElementById('loading').style.display = 'none';
      document.getElementById('grid').style.display = 'none';
      document.getElementById('empty').style.display = 'none';
    }

    function updateBackendStatus(online) {
      backendOnline = online;
      const dot = document.getElementById('status-dot');
      const text = document.getElementById('status-text');

      if (online) {
        dot.classList.add('online');
        text.textContent = 'Connected';
      } else {
        dot.classList.remove('online');
        text.textContent = 'Offline';
      }
    }

    function showToast(msg, isError) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'toast' + (isError ? ' error' : '');
      setTimeout(() => toast.classList.add('show'), 10);
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function renderCategories(categories) {
      const sidebar = document.getElementById('sidebar');
      sidebar.innerHTML = '';

      // Add "All" category
      const allCat = document.createElement('div');
      allCat.className = 'cat-item active';
      allCat.dataset.cat = 'all';
      const totalCount = categories.reduce((sum, cat) => sum + cat.shape_count, 0);
      allCat.innerHTML = `<span class="cat-label">All</span><span class="cat-count">${totalCount}</span>`;
      sidebar.appendChild(allCat);

      // Add other categories
      categories.forEach(cat => {
        if (cat.name === 'all') return; // Skip duplicate "all"

        const item = document.createElement('div');
        item.className = 'cat-item';
        item.dataset.cat = cat.name;
        item.innerHTML = `<span class="cat-label">${cat.display_name}</span><span class="cat-count">${cat.shape_count}</span>`;
        sidebar.appendChild(item);
      });

      // Add click handlers
      sidebar.addEventListener('click', (e) => {
        const item = e.target.closest('.cat-item');
        if (!item) return;

        document.querySelectorAll('.cat-item').forEach(el => el.classList.remove('active'));
        item.classList.add('active');

        currentCat = item.dataset.cat;
        loadShapes();
      });
    }

    function renderShapes(shapes) {
      const grid = document.getElementById('grid');
      const empty = document.getElementById('empty');
      const countLabel = document.getElementById('count-label');

      hideLoading();
      grid.innerHTML = '';

      if (shapes.length === 0) {
        grid.style.display = 'none';
        empty.style.display = 'flex';
        countLabel.textContent = 'No shapes';
      } else {
        grid.style.display = 'grid';
        empty.style.display = 'none';
        countLabel.textContent = `${shapes.length} shape${shapes.length === 1 ? '' : 's'}`;

        shapes.forEach(shape => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="card-preview">${shape.svg}</div>
            <div class="card-name" title="${shape.name}">${shape.name}</div>
            <button class="card-insert">Insert</button>
            ${shape.is_custom ? '<div class="card-actions"><button class="card-delete" data-id="' + shape.id + '">Delete</button></div>' : ''}
          `;

          // Insert button
          card.querySelector('.card-insert').addEventListener('click', (e) => {
            e.stopPropagation();
            parent.postMessage({
              pluginMessage: {
                type: 'insert',
                svg: shape.svg_content || shape.svg,
                name: shape.name
              }
            }, '*');
            showToast(`Inserted ${shape.name}`);
          });

          // Delete button (if custom)
          const deleteBtn = card.querySelector('.card-delete');
          if (deleteBtn) {
            deleteBtn.addEventListener('click', async (e) => {
              e.stopPropagation();
              if (!confirm(`Delete "${shape.name}"?`)) return;

              try {
                await deleteShape(shape.id);
                showToast(`Deleted ${shape.name}`);
                await loadAll(); // Reload everything
              } catch (error) {
                showToast('Failed to delete shape', true);
              }
            });
          }

          grid.appendChild(card);
        });
      }
    }

    async function loadCategories() {
      try {
        const categories = await fetchCategories();
        allCategories = categories;
        renderCategories(categories);
      } catch (error) {
        console.error('Error loading categories:', error);
        showToast('Failed to load categories', true);
      }
    }

    async function loadShapes() {
      try {
        showLoading();
        const shapes = await fetchShapes(
          currentCat === 'all' ? null : currentCat,
          currentSearch || null
        );
        allShapes = shapes;
        renderShapes(shapes);
      } catch (error) {
        console.error('Error loading shapes:', error);
        hideLoading();
        showToast('Failed to load shapes', true);
      }
    }

    async function loadAll() {
      showLoading();

      // Check backend
      const online = await checkBackend();
      updateBackendStatus(online);

      if (!online) {
        showError();
        return;
      }

      try {
        await loadCategories();
        await loadShapes();
      } catch (error) {
        console.error('Error loading data:', error);
        showError();
      }
    }

    // Search handler
    document.getElementById('search').addEventListener('input', (e) => {
      currentSearch = e.target.value;
      loadShapes();
    });

    // Upload Modal Functions
    let uploadedFile = null;
    let uploadedSVGContent = null;

    function openUploadModal() {
      if (!backendOnline) {
        showToast('Backend is offline. Cannot upload shapes.', true);
        return;
      }
      document.getElementById('upload-modal').style.display = 'flex';
      resetUploadForm();
    }

    function closeUploadModal() {
      document.getElementById('upload-modal').style.display = 'none';
      resetUploadForm();
    }

    function closeModalOnOverlay(event) {
      if (event.target.id === 'upload-modal') {
        closeUploadModal();
      }
    }

    function resetUploadForm() {
      uploadedFile = null;
      uploadedSVGContent = null;
      document.getElementById('file-input').value = '';
      document.getElementById('shape-name').value = '';
      document.getElementById('shape-category').value = 'custom';
      document.getElementById('shape-tags').value = '';
      document.getElementById('upload-area').style.display = 'block';
      document.getElementById('upload-preview').style.display = 'none';
      document.getElementById('upload-submit').disabled = true;
    }

    // Drag and drop handlers
    const uploadArea = document.getElementById('upload-area');

    uploadArea.addEventListener('click', () => {
      document.getElementById('file-input').click();
    });

    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');

      const files = e.dataTransfer.files;
      if (files.length > 0) {
        handleFile(files[0]);
      }
    });

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (file) {
        handleFile(file);
      }
    }

    function handleFile(file) {
      // Validate file type
      if (!file.name.endsWith('.svg')) {
        showToast('Please select an SVG file', true);
        return;
      }

      // Validate file size (512KB = 524288 bytes)
      if (file.size > 524288) {
        showToast('File size exceeds 512KB limit', true);
        return;
      }

      uploadedFile = file;

      // Read file content
      const reader = new FileReader();
      reader.onload = (e) => {
        uploadedSVGContent = e.target.result;

        // Validate SVG content
        if (!uploadedSVGContent.includes('<svg')) {
          showToast('Invalid SVG file', true);
          uploadedFile = null;
          uploadedSVGContent = null;
          return;
        }

        // Show preview
        showUploadPreview(uploadedSVGContent, file.name);
      };
      reader.readAsText(file);
    }

    function showUploadPreview(svgContent, fileName) {
      // Hide upload area, show preview
      document.getElementById('upload-area').style.display = 'none';
      document.getElementById('upload-preview').style.display = 'flex';

      // Display SVG preview
      const previewDiv = document.getElementById('preview-svg');
      previewDiv.innerHTML = svgContent;

      // Auto-fill name from filename
      const nameWithoutExt = fileName.replace('.svg', '');
      document.getElementById('shape-name').value = nameWithoutExt;

      // Enable submit button
      document.getElementById('upload-submit').disabled = false;
    }

    async function submitUpload() {
      const name = document.getElementById('shape-name').value.trim();
      const category = document.getElementById('shape-category').value;
      const tagsInput = document.getElementById('shape-tags').value.trim();

      if (!name) {
        showToast('Please enter a shape name', true);
        return;
      }

      if (!uploadedSVGContent) {
        showToast('No file uploaded', true);
        return;
      }

      // Prepare tags array
      const tags = tagsInput ? tagsInput.split(',').map(t => t.trim()).filter(t => t) : [];

      // Disable submit button during upload
      const submitBtn = document.getElementById('upload-submit');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Uploading...';

      try {
        const response = await fetch(`${API_BASE_URL}/api/shapes`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            name: name,
            category: category,
            svg_content: uploadedSVGContent,
            tags: tags,
            is_custom: true
          })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          showToast('Shape uploaded successfully!');
          closeUploadModal();

          // Reload shapes to show the new one
          await loadCategories();
          await loadShapes();
        } else {
          throw new Error(result.error || 'Upload failed');
        }
      } catch (error) {
        console.error('Upload error:', error);
        showToast(error.message || 'Failed to upload shape', true);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Upload & Save';
      }
    }

    // Initialize
    loadAll();
  </script>
</body>

</html>
