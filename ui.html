<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>SVG Studio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%;
      overflow: hidden
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif;
      background: #1e1e1e;
      color: #e5e5e5;
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-size: 12px
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid #333;
      background: #242424;
      flex-shrink: 0
    }

    .logo {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 7px
    }

    .logo-dot {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      background: linear-gradient(135deg, #4f46e5, #ec4899);
      flex-shrink: 0
    }

    .search-wrap {
      flex: 1;
      position: relative
    }

    .search-input {
      width: 100%;
      background: #2d2d2d;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 7px 12px 7px 32px;
      color: #e5e5e5;
      font-size: 12px;
      outline: none;
      transition: border-color .15s
    }

    .search-input:focus {
      border-color: #18a0fb
    }

    .search-input::placeholder {
      color: #666
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #777;
      pointer-events: none
    }

    .main {
      display: flex;
      flex: 1;
      overflow: hidden
    }

    .sidebar {
      width: 128px;
      min-width: 128px;
      border-right: 1px solid #333;
      overflow-y: auto;
      padding: 6px 0;
      background: #1e1e1e;
      flex-shrink: 0
    }

    .cat-item {
      padding: 7px 10px;
      font-size: 11.5px;
      cursor: pointer;
      color: #aaa;
      border-radius: 5px;
      margin: 1px 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
      transition: all .1s;
      user-select: none
    }

    .cat-item:hover {
      background: #2a2a2a;
      color: #e5e5e5
    }

    .cat-item.active {
      background: #18a0fb18;
      color: #18a0fb;
      font-weight: 600
    }

    .cat-label {
      flex: 1
    }

    .cat-count {
      font-size: 9.5px;
      color: #555;
      background: #2a2a2a;
      border-radius: 8px;
      padding: 1px 5px;
      min-width: 18px;
      text-align: center
    }

    .cat-item.active .cat-count {
      background: #18a0fb22;
      color: #18a0fb99
    }

    .grid-area {
      flex: 1;
      overflow-y: auto;
      padding: 10px
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(86px, 1fr));
      gap: 8px
    }

    .card {
      background: #252525;
      border-radius: 8px;
      padding: 8px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color .12s, background .12s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px
    }

    .card:hover {
      border-color: #18a0fb55;
      background: #2c2c2c
    }

    .card-preview {
      width: 70px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      background: #1a1a1a;
      overflow: hidden;
      flex-shrink: 0
    }

    .card-preview svg {
      width: 100%;
      height: 100%;
      display: block
    }

    .card-name {
      font-size: 9.5px;
      color: #aaa;
      text-align: center;
      line-height: 1.3;
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .card-insert {
      width: 100%;
      padding: 4px 0;
      background: #18a0fb;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: background .1s
    }

    .card-insert:hover {
      background: #0d8de0
    }

    .card-insert:active {
      background: #0a7ac8
    }

    .card-insert:disabled {
      background: #444;
      cursor: default
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #555;
      font-size: 12px;
      padding: 60px 20px
    }

    .footer {
      padding: 6px 14px;
      border-top: 1px solid #2a2a2a;
      font-size: 10.5px;
      color: #555;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e1e1e;
      flex-shrink: 0
    }

    .toast {
      position: fixed;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: #2d2d2d;
      border: 1px solid #444;
      color: #e5e5e5;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 11px;
      opacity: 0;
      transition: all .2s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 999
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0)
    }

    .toast.error {
      border-color: #ef4444;
      color: #fca5a5
    }

    ::-webkit-scrollbar {
      width: 4px
    }

    ::-webkit-scrollbar-track {
      background: transparent
    }

    ::-webkit-scrollbar-thumb {
      background: #3a3a3a;
      border-radius: 2px
    }
  </style>
</head>

  <div class="footer">

    <span>SVG Studio v1.0</span>

      { id: 'br6', name: 'Double Border', cat: 'borders', svg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect x="10" y="10" width="180" height="180" fill="none" stroke="#0EA5E9" stroke-width="2"/><rect x="20" y="20" width="160" height="160" fill="none" stroke="#0EA5E9" stroke-width="2"/></svg>' }
    ];

    var currentCat = 'all';
    var currentSearch = '';

    function render() {
      var filtered = ASSETS.filter(function(a) {
        var matchCat = currentCat === 'all' || a.cat === currentCat;
        var matchSearch = a.name.toLowerCase().includes(currentSearch.toLowerCase());
        return matchCat && matchSearch;
      });

      var grid = document.getElementById('grid');
      var empty = document.getElementById('empty');
      var countLabel = document.getElementById('count-label');

      grid.innerHTML = '';

      if (filtered.length === 0) {
        grid.style.display = 'none';
        empty.style.display = 'flex';
        countLabel.textContent = 'No assets';
      } else {
        grid.style.display = 'grid';
        empty.style.display = 'none';
        countLabel.textContent = filtered.length + ' asset' + (filtered.length === 1 ? '' : 's');

        filtered.forEach(function(asset) {
          var card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = '<div class="card-preview">' + asset.svg + '</div>' +
            '<div class="card-name" title="' + asset.name + '">' + asset.name + '</div>' +
            '<button class="card-insert">Insert</button>';

          card.querySelector('.card-insert').addEventListener('click', function(e) {
            e.stopPropagation();
            parent.postMessage({ pluginMessage: { type: 'insert', svg: asset.svg, name: asset.name } }, '*');
            showToast('Inserted ' + asset.name);
          });

          grid.appendChild(card);
        });
      }
    }

    function showToast(msg, isError) {
      var toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'toast' + (isError ? ' error' : '');
      setTimeout(function() { toast.classList.add('show'); }, 10);
      setTimeout(function() { toast.classList.remove('show'); }, 2000);
    }

    document.getElementById('search').addEventListener('input', function(e) {
      currentSearch = e.target.value;
      render();
    });

    document.getElementById('sidebar').addEventListener('click', function(e) {
      var item = e.target.closest('.cat-item');
      if (!item) return;

      document.querySelectorAll('.cat-item').forEach(function(el) { el.classList.remove('active'); });
      item.classList.add('active');

      currentCat = item.getAttribute('data-cat');
      render();
    });

    render();
  </script>
